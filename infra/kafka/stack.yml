# Kafka (KRaft, bez ZooKeepera): 3 brokery na worker1–3 + Kafka UI na masterze.
#
# Po co: kolejka zleceń biuletynu (B1/B2 -> raporter Bielik) oraz strumienie S1/S2/D zespołu.
# Każdy broker jest też kontrolerem (głosuje przy wyborze lidera). Tematy domyślnie w 3 kopiach, zapis wymaga
# potwierdzenia 2 kopii (min.insync.replicas=2) — awaria jednej maszyny nie gubi danych i nie zatrzymuje Kafki.
# Sieć „host”: broker N słucha na IP swojej maszyny, port 9092 (klienci) i 9093 (kontrolery).
# CLUSTER_ID: stały identyfikator klastra (nie jest tajny); zmiana = nowy, pusty klaster.
#
# Wdrożenie (na masterze, w katalogu z tym plikiem i .env z hasłem do Kafka UI):
#   set -a; . ./.env; set +a
#   docker stack deploy -c stack.yml rbd-kafka
# Klienci: bootstrap 10.7.11.22:9092,10.7.11.23:9092,10.7.11.24:9092
# Panel:   http://10.7.11.21:8090 (admin, hasło z .env)

x-kafka-env: &kafka-env
  CLUSTER_ID: fIJlM05OT_65iBvnkNNbDQ
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@10.7.11.22:9093,2@10.7.11.23:9093,3@10.7.11.24:9093
  KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_NUM_PARTITIONS: "3"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: -Xmx1g -Xms1g

x-kafka-deploy: &kafka-deploy
  restart_policy:
    condition: any

services:
  kafka-1:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.7.11.22:9092
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [hostnet]
    deploy:
      <<: *kafka-deploy
      placement:
        constraints: [node.hostname == Bigdata-wn212-02]

  kafka-2:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.7.11.23:9092
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [hostnet]
    deploy:
      <<: *kafka-deploy
      placement:
        constraints: [node.hostname == Bigdata-wn212-03]

  kafka-3:
    image: apache/kafka:4.3.1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.7.11.24:9092
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [hostnet]
    deploy:
      <<: *kafka-deploy
      placement:
        constraints: [node.hostname == Bigdata-wn212-04]

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      SERVER_PORT: "8090"
      KAFKA_CLUSTERS_0_NAME: rbd
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 10.7.11.22:9092,10.7.11.23:9092,10.7.11.24:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: ${KAFKA_UI_PASSWORD}
    networks: [hostnet]
    deploy:
      <<: *kafka-deploy
      placement:
        constraints: [node.role == manager]

volumes:
  kafka-data:      # osobny lokalny wolumen na każdej maszynie (broker przypięty do maszyny)

networks:
  hostnet:
    external: true
    name: host
