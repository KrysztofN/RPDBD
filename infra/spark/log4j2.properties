# Logi samego Sparka (driver): tylko ostrzeżenia i błędy. Nasze komunikaty idą przez lib/log.py (Python).
# Używane przez infra/spark/submit.sh (-Dlog4j2.configurationFile). Szczegóły Sparka: zmień `warn` na `info`.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-7p spark: %m%n

# znane, niegroźne ostrzeżenia przy starcie
logger.nativeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativeloader.level = error
