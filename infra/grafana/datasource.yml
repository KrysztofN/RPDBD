# Połączenie Grafana -> ClickHouse (wczytywane przy starcie Grafany).
# Hasło z zmiennej środowiskowej CLICKHOUSE_PASSWORD (ustawianej w stack.yml z .env na klastrze).
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse-rbd
    type: grafana-clickhouse-datasource
    isDefault: true
    editable: false
    jsonData:
      host: 10.7.11.21
      port: 8123
      protocol: http
      username: rbd
      defaultDatabase: rbd
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
